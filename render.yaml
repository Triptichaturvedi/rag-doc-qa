services:
  - type: web
    name: rag-doc-qa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-lite.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
